name: Greylock Partners
description: Greylock Partners is one of the oldest and best-known venture capital firms in the United
  States, founded in 1965 in Cambridge, Massachusetts and headquartered in Menlo Park, California. Greylock
  is an early-stage-focused firm that partners with founders at the pre-seed, seed, and Series A stages,
  deploying the majority of its capital as a first check and continuing to back companies through Series
  B and beyond. The firm reports over $3.5 billion in committed capital under management. Greylock invests
  across enterprise and consumer software with an explicitly AI-first thesis, concentrating on applications,
  infrastructure, cybersecurity, fintech, consumer, and deep tech. Its portfolio and alumni network includes
  category-defining companies such as LinkedIn, Facebook, Airbnb, Workday, Palo Alto Networks, Cloudera,
  Coinbase, Figma, Discord, and Anthropic. Partners include Reid Hoffman, Asheem Chandna, Saam Motamedi,
  Jerry Chen, David Sze, and Mike Duboe.
